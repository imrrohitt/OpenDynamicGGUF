[project]
name = "opendynamicgguf"
version = "0.1.0"
description = "Automatic per-tensor mixed-precision GGUF quantization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.24.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
odg = "odg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["odg*"]
